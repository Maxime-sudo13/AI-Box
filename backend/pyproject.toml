[project]
name = "business-ai-box"
version = "0.6.4"
description = "Business AI Box — backend applicatif"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pdfplumber>=0.11.10",
    "reportlab>=5.1.0",
    "python-multipart>=0.0.33",
    "pypdfium2>=5.15.2",
    "pytesseract>=0.3.13",
    "httpx>=0.28.1",
    "cryptography>=50.0.2",
    "apscheduler>=3.10,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "aiosmtpd>=1.4.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["shared_data: le module partage un jeu de données construit une seule fois"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 : Depends(...) en valeur par défaut est l'idiome FastAPI.
# E501 : la largeur est assurée par le formateur ; seules dépassent des phrases destinées à l'utilisateur.
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
# Catalogues de données du restaurant fictif : une ligne par produit reste plus lisible.
"app/demo/restaurant.py" = ["E741", "B023"]
