# Business AI Box — déploiement sur le boîtier.
# Usage : cp .env.example .env, renseigner le mot de passe, puis `docker compose up -d --build`.
name: business-ai-box

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bab
      POSTGRES_USER: bab
      POSTGRES_PASSWORD: ${BAB_DB_PASSWORD:?Renseignez BAB_DB_PASSWORD dans deploy/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bab -d bab"]
      interval: 5s
      retries: 20
    networks: [internal]

  api:
    # Image versionnée : construite sur place, ou chargée depuis un paquet de mise à jour signé.
    image: business-ai-box-api:${BAB_VERSION:-dev}
    build: ../backend
    restart: unless-stopped
    environment:
      BAB_DATABASE_URL: postgresql+psycopg://bab:${BAB_DB_PASSWORD}@db:5432/bab
      BAB_OLLAMA_URL: http://ollama:11434
      BAB_AI_MODEL: ${BAB_AI_MODEL:-qwen2.5:7b}
      BAB_AI_ROUTING: ${BAB_AI_ROUTING:-secours}
      # Envoi des courriels autorisés (facultatif). Sans serveur SMTP : boîte d'envoi locale.
      BAB_SMTP_HOST: ${BAB_SMTP_HOST:-}
      BAB_SMTP_PORT: ${BAB_SMTP_PORT:-587}
      BAB_SMTP_USER: ${BAB_SMTP_USER:-}
      BAB_SMTP_PASSWORD: ${BAB_SMTP_PASSWORD:-}
      BAB_MAIL_FROM: ${BAB_MAIL_FROM:-}
      # Mode « zéro communication externe » : aucun connecteur en ligne, aucun envoi SMTP.
      BAB_OFFLINE_MODE: ${BAB_OFFLINE_MODE:-true}
      BAB_IMPORT_ROOT: /depot
      BAB_BACKUP_DIR: /sauvegardes
      # Clé de chiffrement des identifiants des connecteurs (sinon générée dans /data).
      BAB_SECRET_KEY: ${BAB_SECRET_KEY:-}
    volumes:
      # Documents originaux importés : à placer sur le disque chiffré du boîtier.
      - documents:/data
      # Dossiers surveillés (scanner, partage réseau) : seul endroit lisible par les connecteurs.
      - ${BAB_DEPOT_DIR:-./depot}:/depot
      # Support de sauvegarde distinct (disque USB, NAS) : sauvegardes chiffrées quotidiennes.
      - ${BAB_BACKUP_MEDIUM:-/mnt/sauvegarde}:/sauvegardes
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  # Modèle d'IA local. Sur le réseau interne : il ne peut joindre aucun service extérieur.
  # Le modèle se télécharge une fois avec deploy/telecharger-modele.sh.
  ollama:
    image: ${BAB_OLLAMA_IMAGE:-ollama/ollama:0.6.8}
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    networks: [internal]
    # Avec une carte graphique NVIDIA (version Professional / Enterprise), décommenter :
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  web:
    image: business-ai-box-web:${BAB_VERSION:-dev}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      BAB_HOSTNAME: ${BAB_HOSTNAME:-businessaibox.local}
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - caddy-data:/data
    depends_on: [api]
    networks: [internal, lan]

networks:
  # La base et l'API n'ont aucune route vers l'extérieur.
  internal:
    internal: true
  lan: {}

volumes:
  db-data:
  documents:
  ollama-models:
  caddy-data:
