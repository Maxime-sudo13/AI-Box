# Business AI Box — test sur votre ordinateur (sans boîtier).
#
#   Windows : .\lancer-en-local.ps1        Mac / Linux : ./lancer-en-local.sh
#
# L'application s'ouvre sur http://localhost:8080 (accessible uniquement depuis ce poste).
# L'IA utilise l'Ollama déjà installé sur l'ordinateur (http://localhost:11434).
name: business-ai-box-local

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bab
      POSTGRES_USER: bab
      POSTGRES_PASSWORD: test-local-uniquement
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bab -d bab"]
      interval: 3s
      retries: 30

  api:
    build: ../backend
    restart: unless-stopped
    environment:
      BAB_DATABASE_URL: postgresql+psycopg://bab:test-local-uniquement@db:5432/bab
      # Pas de HTTPS en test local : le cookie de session circule en HTTP sur ce seul poste.
      BAB_COOKIE_SECURE: "false"
      # Ollama de l'ordinateur hôte.
      BAB_OLLAMA_URL: ${BAB_OLLAMA_URL:-http://host.docker.internal:11434}
      BAB_AI_MODEL: ${BAB_AI_MODEL:-qwen2.5:7b}
      BAB_IMPORT_ROOT: /depot
      BAB_BACKUP_DIR: /sauvegardes
      BAB_OFFLINE_MODE: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - documents:/data
      # Déposez des factures dans deploy/depot/ pour tester le « Dossier surveillé ».
      - ./depot:/depot
      # Support de sauvegarde distinct (disque USB, NAS) : sauvegardes chiffrées quotidiennes.
      - ./sauvegardes:/sauvegardes
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        CADDYFILE: deploy/Caddyfile.local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on: [api]

volumes:
  db-data:
  documents:
